name: sentinel

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ARTIFACTS_DIR: /opt/sentinel/ml/artifacts
      REPLAY_DIR: /opt/sentinel/data/replay
    ports:
      - "8000:8000"
    volumes:
      # Source mounted for fast iteration (restart api to pick up changes).
      - ./backend:/srv
      # Lane B outputs, read-only: ml/featurize.py + ml/artifacts/, data/replay/.
      - ./ml:/opt/sentinel/ml:ro
      - ./data:/opt/sentinel/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
